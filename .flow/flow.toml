# The project values of the flow, read by .flow/loop/flow_config.py.

[project]
repo = "hungle-agilityio/agent-flow-starter"
owner = "hungle-agilityio"
app_dir = "."
display_name = "Agent flow starter"
slug = "starter"

[loop]
state_dir = "~/.starter"
tmux_session = "starter-loop"
launchd_label = "com.starter.loop"
setup_command = ["bash", "scripts/setup.sh"]
alone_words = []

[checks]
commands = [["bash", "scripts/check.sh"]]
ci_workflow = "Checks"
protected_test_dirs = ["tests"]

[release]
timezone = "Asia/Ho_Chi_Minh"
deploy_line = ""

[plugin]
id = "agent-flow@starter"
marketplace = "starter"

[paths]
loop_dir = ".flow/loop"
plugin_dir = ".flow/plugin"
intent_file = "docs/intent/{feature}.md"
specs_dir = "docs/specs"
spec_pr_dirs = ["docs/intent", "docs/specs", "docs/design"]
plans_dir = "docs/plans"
decisions_dir = "docs/decisions"
templates_dir = "docs/templates"
code_dirs = ["src"]
flow_dirs = [".flow/", ".claude/", ".github/", "docs/intent/", "docs/specs/", "docs/design/", "scripts/"]
